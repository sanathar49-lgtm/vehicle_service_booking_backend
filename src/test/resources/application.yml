spring:
  datasource:
    url: jdbc:h2:mem:vehicle;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate.dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
app:
  jwt-secret: test-only-secret-key-at-least-32-characters-long
  jwt-expiration-ms: 86400000
  cors-origin: http://localhost:5173
  admin-email: ''
  admin-password: ''
